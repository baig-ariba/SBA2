<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Accessible Design Co.</title>
</head>
<body>
    <nav class="nav-bar">
        <div class="co-logo">
            <img src="/images/Company Logo.jpg" alt="Company logo.">
        </div>
        <ul id="nav-elements">
            <li><a href="/home.html">Home</a></li>
            <li><a href="/AboutUs.html">About Us</a></li>
            <li><a href="/Services.html">Services</a></li>
            <li><a href="/ContactUs.html">Contact Us</li>
        </ul> 
    </nav>

    <section class="header">    
        <div class="co-name">
            <h1>Accessible Design Co.</h1>
            <button type="button" class="about-us-button"><a href="/AboutUs.html">Know more about us</a></button>
        </div>
        <div class="image">
            <img src="" alt="Image of Company something">
        </div>
    </section>

    <article class="about-info">
        <div class="about-us">
            <h3>What we do</h3>
        </div>
    </article>

    <section class="services">
        <div class="">

        </div>
    </section>

    <section class="contact-form">
        <form action="none" method="POST">
        <fieldset class="Name">
          <legend>Contact Information</legend>
          <label for="customer-name">Name</label>
          <input type="text" id="costumer-name" placeholder="Zohran Mamdani"/>
          <label for="customer-email">E-mail address</label>
          <input type="email" id="customer-email" placeholder="sample@sample.com"/>
          <label for="Subject">Subject</label>
          <input type="text" id="Subject" placeholder="Subject of your query">
          <label for="customer-message">Message</label>
          <input type="text" id="customer-message" placeholder="Message for us."/>
        </fieldset>
        <input type="submit" value="REGISTER">
    </section>
</body>
